[package]
name = "weightlang-iris"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Train and evaluate the WeightLang Iris classifier through wgtime"

[workspace]

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgt = { package = "wgt-model", path = "../../crates/wgt-model" }
