[project]
name = "weightlang"
version = "0.2.0"
description = "WeightLang prototype: compile .wgt network descriptions into runnable PyTorch artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.2",
    "safetensors>=0.4",
    "tomli>=2; python_version < '3.11'",
    "numpy",  # not used directly; avoids torch warning "Failed to initialize NumPy" on every run
]

[project.urls]
Homepage = "https://github.com/WeightLang/WeightLang"
Documentation = "https://github.com/WeightLang/WeightLang/tree/main/docs"
Releases = "https://github.com/WeightLang/WeightLang/releases"

[project.optional-dependencies]
test = ["pytest>=8"]
formats = ["onnx>=1.17", "gguf>=0.17"]
transformers = ["transformers==5.7.0", "tokenizers>=0.22.0,<=0.23.0", "huggingface-hub>=1.5.0,<2.0"]

[project.scripts]
weightc = "weightlang.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weightlang = ["std/*.wgt", "primitive_specs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
