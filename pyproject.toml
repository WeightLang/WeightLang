[project]
name = "weightlang"
version = "0.1.0"
description = "WeightLang prototype: compile .wgt network descriptions into runnable PyTorch artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.2",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
weightc = "weightlang.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
