<text x="104" y="504" fill="#4b5c77" text-anchor="end" font-size="18">6</text><text x="136" y="504" xml:space="preserve" font-size="22"><tspan fill="#c6acff">output</tspan><tspan fill="#e7edf8"> y</tspan><tspan fill="#e7edf8">:</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#80e2c4">f32</tspan><tspan fill="#e7edf8">[</tspan><tspan fill="#c4d6f3">feature</tspan><tspan fill="#b9c8e4">=</tspan><tspan fill="#f3c78c">4</tspan><tspan fill="#e7edf8">]</tspan></text>
<text x="104" y="536" fill="#4b5c77" text-anchor="end" font-size="18">7</text><text x="136" y="536" xml:space="preserve" font-size="22"><tspan fill="#e7edf8"></tspan></text>
<text x="104" y="568" fill="#4b5c77" text-anchor="end" font-size="18">8</text><text x="136" y="568" xml:space="preserve" font-size="22"><tspan fill="#7e8da6"># Independent projections learn values and a gate in (0, 1).</tspan></text>
<text x="104" y="600" fill="#4b5c77" text-anchor="end" font-size="18">9</text><text x="136" y="600" xml:space="preserve" font-size="22"><tspan fill="#c6acff">layer</tspan><tspan fill="#e7edf8"> gate</tspan><tspan fill="#e7edf8">:</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#95caff">linear</tspan><tspan fill="#e7edf8">(</tspan><tspan fill="#f3c78c">4</tspan><tspan fill="#e7edf8">)</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#b9c8e4">-&gt;</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#95caff">sigmoid</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#c6acff">from</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#c6acff">input</tspan></text>
<text x="104" y="632" fill="#4b5c77" text-anchor="end" font-size="18">10</text><text x="136" y="632" xml:space="preserve" font-size="22"><tspan fill="#c6acff">layer</tspan><tspan fill="#e7edf8"> value</tspan><tspan fill="#e7edf8">:</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#95caff">linear</tspan><tspan fill="#e7edf8">(</tspan><tspan fill="#f3c78c">4</tspan><tspan fill="#e7edf8">)</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#c6acff">from</tspan><tspan fill="#e7edf8"> </tspan><tspan fill="#c6acff">input</tspan></text>
<text x="104" y="664" fill="#4b5c77" text-anchor="end" font-size="18">11</text><text x="136" y="664" xml:space="preserve" font-size="22"><tspan fill="#e7edf8"></tspan></text>
<text x="104" y="696" fill="#4b5c77" text-anchor="end" font-size="18">12</text><text x="136" y="696" xml:space="preserve" font-size="22"><tspan fill="#7e8da6"># Elementwise gating preserves the four-feature shape.</tspan></text>
<text x="104" y="728" fill="#4b5c77" text-anchor="end" font-size="18">13</text><text x="136" y="728" xml:space="preserve" font-size="22"><tspan fill="#c6acff">layer</tspan><tspan fill="#e7edf8"> selected</tspan><tspan fill="#e7edf8">:</tspan><tspan fill="#e7edf8"> gate </tspan><tspan fill="#b9c8e4">*</tspan><tspan fill="#e7edf8"> value</tspan></text>
<text x="104" y="760" fill="#4b5c77" text-anchor="end" font-size="18">14</text><text x="136" y="760" xml:space="preserve" font-size="22"><tspan fill="#e7edf8"></tspan></text>
