<text x="104" y="376" fill="#4b5c77" text-anchor="end" font-size="18">2</text><text x="136" y="376" xml:space="preserve" font-size="22"><tspan fill="#c6acff">model</tspan><tspan fill="#e7edf8"> gated_projection</tspan></text>
<text x="104" y="408" fill="#4b5c77" text-anchor="end" font-size="18">3</text><text x="136" y="408" xml:space="preserve" font-size="22"><tspan fill="#e7edf8"></tspan></text>
<text x="104" y="440" fill="#4b5c77" text-anchor="end" font-size="18">4</text><text x="136" y="440" xml:space="preserve" font-size="22"><tspan fill="#7e8da6"># Each input has four features; the batch axis is implicit.</tspan></text>
