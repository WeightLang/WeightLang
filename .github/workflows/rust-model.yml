name: Rust model coverage

on:
  workflow_call:
    inputs:
      release-version:
        description: Artifact containing the prepared release manifests
        type: string
        default: ''
      source-tree:
        description: Exact Git tree of the prepared release candidate
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'crates/wgt/src/rust_export.rs'
      - 'crates/wgt/tests/rust_export.rs'
      - 'crates/wgt-model/**'
      - 'crates/wgt-model-macros/**'
      - 'crates/wgtime/**'
      - 'crates/wgtime-control/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/wgt-language/**'
      - 'std/**'
      - 'examples/native_training/non_backprop/**'
      - 'crates/wgtime-core/src/compiled_forward.rs'
      - 'crates/wgtime-core/src/adaptive*'
      - 'crates/wgtime-core/src/adaptive/**'
      - 'crates/wgtime-core/tests/compiled*.rs'
      - 'crates/wgtime-core/tests/adaptive_numeric.rs'
      - 'crates/wgtime-core/tests/local_learning.rs'
      - 'crates/wgtime-core/tests/composition_lowering.rs'
      - 'crates/wgtime-service/**'
      - 'language/**'
      - '.github/workflows/rust-model.yml'
  pull_request:
    paths:
      - 'crates/wgt/src/rust_export.rs'
      - 'crates/wgt/tests/rust_export.rs'
      - 'crates/wgt-model/**'
      - 'crates/wgt-model-macros/**'
      - 'crates/wgtime/**'
      - 'crates/wgtime-control/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/wgt-language/**'
      - 'std/**'
      - 'examples/native_training/non_backprop/**'
      - 'crates/wgtime-core/src/compiled_forward.rs'
      - 'crates/wgtime-core/src/adaptive*'
      - 'crates/wgtime-core/src/adaptive/**'
      - 'crates/wgtime-core/tests/compiled*.rs'
      - 'crates/wgtime-core/tests/adaptive_numeric.rs'
      - 'crates/wgtime-core/tests/local_learning.rs'
      - 'crates/wgtime-core/tests/composition_lowering.rs'
      - 'crates/wgtime-service/**'
      - 'language/**'
      - '.github/workflows/rust-model.yml'

permissions:
  contents: read

concurrency:
  group: rust-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  native-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.release-version != ''
        with:
          name: ${{ inputs.release-version }}
      - name: Verify the exact release candidate
        if: inputs.release-version != ''
        env:
          SOURCE_TREE: ${{ inputs.source-tree }}
        run: |
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml python/pyproject.toml python/weightlang/__init__.py
          test "$(git write-tree)" = "$SOURCE_TREE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all model instructions and state semantics
        run: >-
          cargo test --locked --no-default-features -p wgtime-core
          --test compiled_instruction_coverage --test compiled_semantics
          --test compiled_forward --test compiled_control_flow --test compiled_training
          --test adaptive_numeric --test local_learning --test composition_lowering
      - name: Compile and run generated Rust consumers
        run: cargo test --locked -p weightlang-wgt --test rust_export
      - name: Build the real model service
        run: cargo build --locked -p wgtime-service --bin wgtime
      - name: Verify service commit and rollback boundary
        run: cargo test --locked -p wgtime-service --bin wgtime adaptive_predict_commits_writes_and_rolls_back_failed_output
      - name: Run Rust SDK models against the real service
        env:
          WGTIME_TEST_DAEMON: ${{ github.workspace }}/target/debug/wgtime
        run: cargo test --locked -p wgt-model -p wgt-model-macros --tests -- --include-ignored
