name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tensor-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the complete workspace
        run: cargo check --locked --workspace --all-targets
      - name: Validate tensor metadata catalog
        run: node scripts/check_tensor_contracts.cjs
      - name: Check WGT parser and language tests
        run: cargo test --locked -p wgt-language
      - name: Keep every WGT example on current syntax
        run: |
          node scripts/check_example_syntax.cjs
          node --test scripts/test_example_syntax.cjs
      - name: Check tensor runtime autodiff
        run: >-
          cargo test --locked --no-default-features -p wgtime-core
          --lib --test adaptive --test adaptive_autodiff --test workspace --test runtime
          --test pooling --test lazy_routing --test parameter_ops
          --test custom_update_strategy --test training
      - name: Check tensor geometry, alias VJP and strategy regressions
        run: cargo test --locked --no-default-features -p wgtime-core --lib --test tensor_contracts --test tensor_strategy_contracts --test attention --test convolution --test workspace
      - name: Check artifact tensor compatibility
        run: cargo test --locked -p weightlang-wgt --test tensor_contracts --test dimensions --test tensor_subgraphs --test primitives --test precision
      - name: Check compiled tensor backend
        run: >-
          cargo test --locked --no-default-features -p wgtime-core
          --test compiled_forward --test compiled_training --test compiled_control_flow
          --test compiled_instruction_coverage --test compiled_semantics
          --test unified_training --test custom_optimization --test operations
          --test adaptive_numeric --test local_learning --test composition_lowering
      - name: Check source execution regressions
        run: |
          cargo build --locked --no-default-features -p wgtime-core --example core-transport-test
          cargo test --locked --no-default-features -p wgtime-core --test accelerator --test assert_syntax --test async_tasks --test categorical --test collect_records --test compute --test file_syntax --test legacy_syntax --test model_calls --test native_testing --test openresponses_core --test postfix_mean --test ppo_records --test ppo_rollout --test ppo_typed --test sample_from --test sample_record --test slicing
          cargo test --locked --no-default-features -p wgtime-core --test custom_operators imported_tuple_destructuring_preserves_library_call_scope
      - name: Check generated editor support
        run: node scripts/generate_editor_support.cjs --check
      - name: Check prelude catalog
        run: |
          node scripts/check_prelude.cjs
          node scripts/test_prelude.cjs
      - name: Check graph viewer behavior
        run: node --test web/viewer/test/*.test.js

  host-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check client and host control
        run: cargo test --locked -p wgtime -p wgtime-control
      - name: Check source packages and native artifact publication
        run: cargo test --locked -p weightlang-wgt --test source_package --test native_publication
      - name: Check native toolchain bundle contracts
        run: cargo test --locked -p weightlang-wgt --test toolchain --test latest
      - name: Check project onboarding and uv delegation
        run: >-
          cargo test --locked -p weightlang-wgt
          --test project_config --test python_project --test starter_projects
          --test no_python_cli --test trainer_forwarding
      - name: Check automatic PyTorch backend preparation
        run: cargo test --locked -p weightlang-wgt --lib torch_backend::tests
      - name: Check language server analysis and real stdio protocol
        run: |
          cargo test --locked -p weightlang-wgt --lib lsp::
          cargo test --locked -p weightlang-wgt --test lsp
      - name: Check Rust model export and generated consumers
        run: cargo test --locked -p weightlang-wgt --test rust_export
      - name: Check allocator instrumentation configuration
        run: cargo check --locked -p wgtime-service --features allocation-metrics
      - name: Check service lifecycle and transport
        run: cargo test --locked -p wgtime-service --bin wgtime --test service --test startup --test strategy
      - name: Build the model service
        run: cargo build --locked -p wgtime-service --bin wgtime
      - name: Check model APIs against the real service
        env:
          WGTIME_TEST_DAEMON: ${{ github.workspace }}/target/debug/wgtime
        run: cargo test --locked -p wgt-model -p wgt-model-macros --tests -- --include-ignored
      - name: Check client compiler and artifact lifecycle
        env:
          WGTIME_TEST_DAEMON: ${{ github.workspace }}/target/debug/wgtime
        run: >-
          cargo test --locked --no-fail-fast -p weightlang-wgt
          --test assert_syntax --test async_aot --test categorical_roundtrip --test cli_service
          --test client_compiler_boundaries --test lifecycle --test model_calls_aot
          --test native_testing --test postfix_mean --test ppo_typed --test script_compiler
          -- --include-ignored

  python-starters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install the starter's declared CPU dependencies
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["RUNNER_TEMP"]) / "wgt-starter"
          project.mkdir()
          template = Path("crates/wgt/templates/tiny-lm.pyproject.toml").read_text(encoding="utf-8")
          config = template.replace("PROJECT_NAME", "starter-ci").replace("PROJECT_MODULE", "local/starter_ci")
          # These runners have no GPU; test the declared dependencies using CPU wheels.
          config += '\n[tool.uv.sources]\ntorch = [{index = "pytorch-ci", marker = "sys_platform != \'darwin\'"}]\n'
          config += '\n[[tool.uv.index]]\nname = "pytorch-ci"\nurl = "https://download.pytorch.org/whl/cpu"\nexplicit = true\n'
          (project / "pyproject.toml").write_text(config, encoding="utf-8")
          PY
          uv sync --project "$RUNNER_TEMP/wgt-starter" --python 3.12
      - name: Train, reload, and infer using the real CPU backends
        run: >-
          uv run --project "$RUNNER_TEMP/wgt-starter" --locked --offline
          python "$GITHUB_WORKSPACE/scripts/test_starter_workflows.py"
      - name: Check MLP with only its own declared dependencies
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          project = Path(os.environ["RUNNER_TEMP"]) / "wgt-mlp-starter"
          project.mkdir()
          templates = Path("crates/wgt/templates")
          config = (templates / "mlp.pyproject.toml").read_text(encoding="utf-8")
          config = config.replace("PROJECT_NAME", "mlp-ci").replace("PROJECT_MODULE", "local/mlp_ci")
          config += '\n[tool.uv.sources]\ntorch = [{index = "pytorch-ci", marker = "sys_platform != \'darwin\'"}]\n'
          config += '\n[[tool.uv.index]]\nname = "pytorch-ci"\nurl = "https://download.pytorch.org/whl/cpu"\nexplicit = true\n'
          (project / "pyproject.toml").write_text(config, encoding="utf-8")
          wgt_config = (templates / "mlp.toml").read_text(encoding="utf-8").replace("PROJECT_MODULE", "local/mlp_ci")
          (project / "wgt.toml").write_text(wgt_config, encoding="utf-8")
          shutil.copyfile(templates / "workflow.py", project / "workflow.py")
          shutil.copyfile(templates / "mlp.csv", project / "data.csv")
          PY
          uv sync --project "$RUNNER_TEMP/wgt-mlp-starter" --python 3.12
          uv run --project "$RUNNER_TEMP/wgt-mlp-starter" --locked --offline python "$RUNNER_TEMP/wgt-mlp-starter/workflow.py" train --steps 2
          uv run --project "$RUNNER_TEMP/wgt-mlp-starter" --locked --offline python "$RUNNER_TEMP/wgt-mlp-starter/workflow.py" infer

  editor-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install editor and browser verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim neovim libxml2-utils
          npm install --prefix "$RUNNER_TEMP/wgt-tools" tree-sitter-cli@0.26.9 playwright@1.62.1
          "$RUNNER_TEMP/wgt-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "$RUNNER_TEMP/wgt-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "WEIGHTLANG_PLAYWRIGHT=$RUNNER_TEMP/wgt-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          chromium_path=$(node -e 'process.stdout.write(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/wgt-tools/node_modules/playwright")
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Verify editor sources and generated parser
        run: |
          npm run generate --prefix editors/tree-sitter-wgt
          node scripts/test_editor_support.cjs
          git diff --exit-code
      - name: Verify and package the VS Code language client
        run: |
          npm ci --prefix editors/vscode
          npm test --prefix editors/vscode
          npm run package --prefix editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: weightlang-editor-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error
      - name: Check standalone viewer in Chromium
        run: |
          cargo build --locked -p weightlang-wgt --bin wgt
          node web/viewer/test/support/artifact.cjs "$RUNNER_TEMP/viewer-artifact"
          target/debug/wgt graph "$RUNNER_TEMP/viewer-artifact" --format html --stdout > "$RUNNER_TEMP/viewer.html"
          node web/viewer/test/axes.browser.mjs "$RUNNER_TEMP/viewer.html"
