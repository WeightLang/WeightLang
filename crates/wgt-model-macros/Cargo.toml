[package]
name = "wgt-model-macros"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/WeightLang/WeightLang"
readme = "../../README.md"
description = "Compile-time checked WGT model definitions for Rust programs"

[lib]
proc-macro = true

[dependencies]
wgt-language = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "proc-macro"] }
