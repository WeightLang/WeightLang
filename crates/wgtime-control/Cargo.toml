[package]
name = "wgtime-control"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WeightLang compiled client control flow without a model execution core"

[dependencies]
wgtime = { path = "../wgtime" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
