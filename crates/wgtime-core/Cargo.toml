[package]
name = "wgtime-core"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Native CPU and cross-platform GPU execution for WeightLang"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wgt-language = { workspace = true }
anyhow = "1"
libloading = "0.8.9"
tempfile = "3"
wgtime-control = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
libc = "0.2"

[dev-dependencies]
safetensors = "0.8"
tempfile = "3"

# Development-only process harness; never installed as a product binary.
[[example]]
name = "core-transport-test"
path = "tests/support/transport.rs"
