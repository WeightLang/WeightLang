[package]
name = "wgt-language"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/WeightLang/WeightLang"
readme = "../../README.md"
description = "Static WeightLang syntax, model plans and artifact schemas"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
sha2 = "0.10"
rustpython-parser = { version = "0.4", default-features = false, features = ["location", "num-bigint"] }

[build-dependencies]
serde_json = "1"
