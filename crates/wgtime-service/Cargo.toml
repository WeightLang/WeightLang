[package]
name = "wgtime-service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
allocation-metrics = []
# Diagnostic timings and validated fixed-frame echo; absent from default builds.
latency-probe = []

[[bin]]
name = "wgtime"
path = "src/main.rs"

[dependencies]
wgtime = { path = "../wgtime" }
wgt-language = { path = "../wgt-language" }
wgtime-core = { path = "../wgtime-core", default-features = false }
anyhow = "1"
serde_json = "1"
libc = "0.2"
