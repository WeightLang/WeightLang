[package]
name = "wgtime-service"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
allocation-metrics = []
# Diagnostic timings and validated fixed-frame echo; absent from default builds.
latency-probe = []

[[bin]]
name = "wgtime"
path = "src/main.rs"

[dependencies]
wgtime = { path = "../wgtime" }
weightlang-runtime = { path = "../wgt-runtime", default-features = false }
anyhow = "1"
serde_json = "1"
libc = "0.2"
