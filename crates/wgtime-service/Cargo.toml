[package]
name = "wgtime-service"
version.workspace = true
edition = "2024"
license = "MIT"

[features]
default = []
allocation-metrics = []
# Diagnostic timings and validated fixed-frame echo; absent from default builds.
latency-probe = []

[[bin]]
name = "wgtime"
path = "src/main.rs"

[dependencies]
wgtime = { workspace = true }
wgt-language = { workspace = true }
wgtime-core = { workspace = true, default-features = false }
anyhow = "1"
serde_json = "1"
libc = "0.2"
