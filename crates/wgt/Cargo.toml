[package]
name = "weightlang-wgt"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Native package manager and architecture renderer for WeightLang"
repository = "https://github.com/WeightLang/WeightLang"

[[bin]]
name = "wgt"
path = "src/main.rs"

[[bin]]
name = "weightc"
path = "src/weightc.rs"

[features]
default = []
gpu = []

[dependencies]
wgtime-control = { workspace = true }
wgt-language = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
wgtime = { workspace = true }
wgtime-core = { workspace = true, default-features = false }
