[package]
name = "weightlang-wgt"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Native package manager and architecture renderer for WeightLang"
repository = "https://github.com/WeightLang/WeightLang"

[[bin]]
name = "wgt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }
flate2 = "1"
tar = "0.4"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
