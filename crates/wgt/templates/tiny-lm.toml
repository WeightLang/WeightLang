[project]
name = "PROJECT_NAME"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6,<3", "transformers>=4.48,<5"]

[tool.uv]
package = false
torch-backend = "auto" # wgt asks uv to select a compatible PyTorch build.

[tool.wgt.project]
module = "PROJECT_MODULE"
edition = "0.5"

[tool.wgt.python]
runner = "workflow.py"

# Change these numbers to design a small GPT-2 architecture from scratch.
# PyTorch/Transformers perform the computation; no pretrained model is fetched.
[tool.wgt.model]
kind = "tiny-lm"
hidden_size = 64
layers = 2
heads = 4
context_length = 128
dropout = 0.0

[tool.wgt.runtime]
device = "auto" # Prefer an available GPU; otherwise use CPU. Explicit devices override this.

[tool.wgt.train]
data = "data.txt" # Your own UTF-8 text; the included text is only a toy corpus.
steps = 100
batch_size = 4
learning_rate = 0.003
weight_decay = 0.01
seed = 42
output = "weights/model"
log_every = 10

[tool.wgt.infer]
checkpoint = "weights/model"
prompt = "WeightLang"
max_new_tokens = 32 # Tokens here are UTF-8 bytes, not words.
temperature = 0.8
top_k = 40
seed = 42
