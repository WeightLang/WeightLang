[package]
name = "wgt-model"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Typed Rust model definitions and clients for the wgtime service"

[lib]
name = "wgt"

[dependencies]
anyhow = "1"
serde_json = "1"
libc = "0.2"
wgtime = { path = "../wgtime" }
wgt-language = { path = "../wgt-language" }
wgt-model-macros = { path = "../wgt-model-macros" }

[dev-dependencies]
tempfile = "3"
