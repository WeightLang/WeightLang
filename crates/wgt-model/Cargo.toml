[package]
name = "wgt-model"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/WeightLang/WeightLang"
readme = "../../README.md"
description = "Typed Rust model definitions and clients for the wgtime service"

[lib]
name = "wgt"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
wgtime = { workspace = true }
wgt-language = { workspace = true }
wgt-model-macros = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
